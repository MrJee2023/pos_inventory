<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.json">
<title>POS Inventory</title>
<style>
:root{--bg:#f4f4f1;--card:#fff;--text:#1a1a1a;--muted:#6b6b6b;--accent:#0f766e;--line:#e3e3dd}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--text:#eee;--muted:#9a9a9a;--line:#333}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:5;background:var(--accent);padding:10px;display:flex;gap:8px}
input,select,button{font:inherit;padding:11px;border-radius:9px;border:1px solid var(--line)}
header input{flex:1;border:0}header select{border:0;max-width:40%}
.wrap{display:grid;gap:12px;padding:12px;max-width:1000px;margin:auto}
@media(min-width:800px){.wrap{grid-template-columns:1fr 340px;align-items:start}#cart{position:sticky;top:70px}}
.item{display:flex;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;cursor:pointer}
.item.off{opacity:.45;pointer-events:none}.n{font-weight:600}.m{font-size:12px;color:var(--muted)}
.p{font-weight:700;color:var(--accent);white-space:nowrap}
#cart{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.q button{width:30px;padding:4px}.q{display:flex;gap:4px;align-items:center}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:700;margin:10px 0}
#pay{width:100%;margin-bottom:8px}#co{width:100%;background:var(--accent);color:#fff;border:0;font-weight:700}
#co:disabled{opacity:.5}#msg{color:#b91c1c;font-size:13px;min-height:18px}
#receipt{display:none}
@media print{body>*:not(#receipt){display:none!important}
#receipt{display:block;width:72mm;margin:0 auto;font:12px monospace;color:#000;background:#fff}
#receipt .l{display:flex;justify-content:space-between}#receipt hr{border:0;border-top:1px dashed #000}.c{text-align:center}}
</style></head><body>
<header><input id="q" type="search" placeholder="Search item..."><select id="t"><option value="">All</option></select></header>
<div class="wrap"><div id="list"></div>
<div id="cart"><b>Cart</b><div id="lines"></div>
<div class="tot"><span>Total</span><span id="total">0</span></div>
<input id="pay" type="number" inputmode="decimal" placeholder="Cash received (optional)">
<div id="msg"></div><button id="co" disabled>Checkout &amp; Print Receipt</button></div></div>
<div id="receipt"></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbywQlpZgJQ_n7rIjGk_6FPfm-cgXa-bPXxVGa7xndg1PtjLzvBgCwxPT6gyYhAvUnLPlw/exec", STORE="Beringga and Ejera Store", CUR="₱";
let items=[],cart={};const $=i=>document.getElementById(i);
const money=n=>CUR+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ok=i=>i.stock>0&&i.status!=="Temporarily unavailable";

function renderList(){
  const q=$("q").value.trim().toLowerCase(),t=$("t").value;
  $("list").innerHTML=items.filter(i=>(!t||i.type===t)&&(!q||(i.id+" "+i.name).toLowerCase().includes(q))).slice(0,150)
  .map(i=>`<div class="item ${ok(i)?"":"off"}" data-id="${esc(i.id)}"><div><div class="n">${esc(i.name)}</div>
  <div class="m">${esc(i.id)} · ${esc(i.type||"")} · Stock ${i.stock} · ${esc(i.status||"")}</div></div><div class="p">${money(i.price)}</div></div>`).join("")||'<p class="m">No items</p>';
}
function renderCart(){
  const ids=Object.keys(cart);let tot=0;
  $("lines").innerHTML=ids.map(id=>{const i=items.find(x=>x.id===id),q=cart[id];tot+=i.price*q;
  return `<div class="row"><span>${esc(i.name)}<br><small class="m">${money(i.price)}</small></span>
  <span class="q"><button data-d="-1" data-id="${esc(id)}">−</button>${q}<button data-d="1" data-id="${esc(id)}">+</button></span><b>${money(i.price*q)}</b></div>`}).join("")||'<p class="m">Tap an item to add</p>';
  $("total").textContent=money(tot);$("co").disabled=!ids.length;
}
$("list").onclick=e=>{const el=e.target.closest(".item");if(!el)return;const id=el.dataset.id,i=items.find(x=>x.id===id);
  if((cart[id]||0)<i.stock){cart[id]=(cart[id]||0)+1;renderCart();}};
$("lines").onclick=e=>{const b=e.target.closest("button");if(!b)return;const id=b.dataset.id,i=items.find(x=>x.id===id);
  cart[id]=(cart[id]||0)+Number(b.dataset.d);if(cart[id]<=0)delete cart[id];if(cart[id]>i.stock)cart[id]=i.stock;renderCart();};
$("q").oninput=$("t").onchange=renderList;

async function load(){
  try{items=JSON.parse(localStorage.getItem("items")||"[]");}catch(e){}
  fill();
  try{items=await (await fetch(API_URL)).json();localStorage.setItem("items",JSON.stringify(items));fill();}
  catch(e){$("msg").textContent="Offline or bad API_URL";}
}
function fill(){const ts=[...new Set(items.map(i=>i.type).filter(Boolean))];
  $("t").innerHTML='<option value="">All</option>'+ts.map(t=>`<option>${esc(t)}</option>`).join("");renderList();renderCart();}

$("co").onclick=async()=>{
  $("co").disabled=true;$("msg").textContent="Saving...";
  try{
    const r=await (await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({cart:Object.entries(cart).map(([id,qty])=>({id,qty}))})})).json();
    if(!r.ok){$("msg").textContent=r.error;$("co").disabled=false;return;}
    const cash=Number($("pay").value)||0;
    $("receipt").innerHTML=`<div class="c"><b>${esc(STORE)}</b><br>${new Date(r.date).toLocaleString()}<br>${r.receipt}</div><hr>`
     +r.lines.map(l=>`<div>${esc(l.name)}</div><div class="l"><span>${l.qty} x ${money(l.price)}</span><span>${money(l.amount)}</span></div>`).join("")
     +`<hr><div class="l"><b>TOTAL</b><b>${money(r.total)}</b></div>`
     +(cash?`<div class="l"><span>Cash</span><span>${money(cash)}</span></div><div class="l"><span>Change</span><span>${money(cash-r.total)}</span></div>`:"")
     +`<hr><div class="c">Thank you!</div>`;
    cart={};$("pay").value="";$("msg").textContent="";
    await load();window.print();
  }catch(e){$("msg").textContent="Failed. Check connection.";$("co").disabled=false;}
};
load();
</script></body></html>
