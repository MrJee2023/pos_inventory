<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10302f"><link rel="manifest" href="manifest.json">
<title>Beringga and Ejera Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#10302f;--sun:#ffcf33;--paper:#f2f6f1;--card:#fff;--text:#14201f;--muted:#5f716e;--line:#d9e3dc;--chili:#d93636;--sky:#2f80c0;--amber:#b86e00}
@media (prefers-color-scheme:dark){:root{--paper:#0c1a19;--card:#142826;--text:#e8f0ee;--muted:#9bb0ac;--line:#25403d}}
*{box-sizing:border-box}
body{margin:0;font-family:Figtree,system-ui,sans-serif;background:var(--paper);color:var(--text);padding-bottom:84px}
button,input{font:inherit}
button{cursor:pointer}:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* shop front */
.front{background:var(--ink);color:#fff;text-align:center;padding:0 16px 26px;position:relative;overflow:hidden}
.awning{height:44px;margin:0 -16px;background:repeating-linear-gradient(90deg,var(--sun) 0 40px,#fff 40px 80px)}
.scal{height:20px;margin:0 -16px;transform-origin:top;animation:sway 5s ease-in-out 1s infinite;
 background:repeating-linear-gradient(90deg,var(--sun) 0 40px,#fff 40px 80px);
 -webkit-mask:radial-gradient(circle at 20px 0,#000 19px,transparent 20px) 0 0/40px 20px repeat-x;
 mask:radial-gradient(circle at 20px 0,#000 19px,transparent 20px) 0 0/40px 20px repeat-x}
@keyframes sway{0%,100%{transform:skewX(0)}50%{transform:skewX(-1.4deg)}}
.logo{width:88px;height:88px;border-radius:50%;object-fit:cover;border:4px solid var(--sun);margin-top:18px;animation:bob 3.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
h1{font-family:'Bricolage Grotesque',Figtree,sans-serif;font-weight:800;font-size:clamp(28px,6vw,48px);line-height:1.05;margin:16px 0 6px;letter-spacing:-.01em}
.sub{margin:0;color:#b9d2cd;font-size:15px}
.open{display:inline-block;margin-top:14px;padding:5px 16px;border:2px solid var(--sun);border-radius:8px;color:var(--sun);font-weight:700;letter-spacing:.08em;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 14px var(--sun);opacity:.8}}

/* toolbar */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.bar-in{max-width:1040px;margin:auto}
#q{width:100%;padding:13px 16px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);font-size:17px}
#q:focus{border-color:var(--sky);outline:0}
#chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chip{flex:none;padding:7px 15px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font-weight:600}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

.wrap{max-width:1040px;margin:auto;padding:14px 16px;display:grid;gap:16px}
@media(min-width:900px){.wrap{grid-template-columns:1fr 340px;align-items:start}}

/* products as price-tag tiles */
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:3px;text-align:left;padding:14px 14px 12px;background:var(--card);color:var(--text);border:1.5px solid var(--line);border-radius:18px 18px 18px 4px;position:relative;transition:transform .12s,border-color .12s}
.tile:hover{border-color:var(--sky)}.tile:active{transform:scale(.97)}
.tile .sw{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-family:'Bricolage Grotesque',sans-serif;margin-bottom:6px}
.nm{font-weight:700;font-size:16px;line-height:1.2;padding-right:70px}
.ty{font-size:13px;color:var(--muted)}
.st{font-size:13px;font-weight:600;color:var(--ink)}
@media(prefers-color-scheme:dark){.st{color:#7fd6c4}}
.st.low{color:var(--amber)}.st.out{color:var(--chili)}
.tag{position:absolute;top:14px;right:0;background:var(--sun);color:#10302f;font-weight:800;padding:4px 10px 4px 20px;font-size:15px;clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%)}
.tile.off{opacity:.5;pointer-events:none}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}

/* cart */
#cart{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:16px}
@media(min-width:900px){#cart{position:sticky;top:132px}}
@media(max-width:899px){#cart{position:fixed;left:0;right:0;bottom:0;z-index:20;border-radius:22px 22px 0 0;max-height:82vh;overflow:auto;transform:translateY(105%);transition:transform .25s;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
 #cart.open{transform:none;box-shadow:0 -10px 40px rgba(0,0,0,.35)}}
.ch{display:flex;justify-content:space-between;align-items:center}
.ch b{font-family:'Bricolage Grotesque',sans-serif;font-size:20px}
#x{border:0;background:none;font-size:26px;color:var(--muted)}@media(min-width:900px){#x{display:none}}
.ln{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.ln small{color:var(--muted)}
.qty{display:flex;align-items:center;gap:8px;font-weight:700}
.qty button{width:32px;height:32px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--text);font-size:18px;line-height:1}
.none{color:var(--muted);padding:18px 0;text-align:center}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 10px;font-size:15px}
.tot b{font-family:'Bricolage Grotesque',sans-serif;font-size:30px}
#pay{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--text)}
#chg{min-height:22px;margin:6px 0;font-weight:600;color:var(--sky)}
#msg{color:var(--chili);font-size:14px;min-height:18px}
#co{width:100%;padding:15px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;font-size:17px}
#co:disabled{opacity:.4}
@media(prefers-color-scheme:dark){#co{background:var(--sun);color:#10302f}}
.bump{animation:bump .3s}@keyframes bump{50%{transform:scale(1.12)}}

/* mobile cart bar */
#fab{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:10;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border:0;border-radius:16px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#fab span:last-child{color:var(--sun);font-size:18px}
@media(min-width:900px){#fab{display:none}body{padding-bottom:20px}}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;z-index:30;transition:transform .25s;border:2px solid var(--sun)}
#toast.show{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#receipt{display:none}
@media print{body>*:not(#receipt){display:none!important}body{padding:0;background:#fff}
#receipt{display:block;width:72mm;margin:0 auto;font:12px monospace;color:#000;background:#fff}
#receipt .l{display:flex;justify-content:space-between}#receipt hr{border:0;border-top:1px dashed #000}.c{text-align:center}}
</style></head><body>

<div class="front">
  <div class="awning"></div><div class="scal"></div>
  <div id="logoBox"></div>
  <h1 id="store"></h1>
  <p class="sub" id="tag"></p>
  <div class="open">OPEN</div>
</div>

<div class="bar"><div class="bar-in">
  <input id="q" type="search" placeholder="Search item name or ID" autocomplete="off">
  <div id="chips"></div>
</div></div>

<div class="wrap">
  <div id="list"></div>
  <aside id="cart">
    <div class="ch"><b>Your order</b><button id="x" aria-label="Close cart">×</button></div>
    <div id="lines"></div>
    <div class="tot"><span>Total</span><b id="total">0</b></div>
    <input id="pay" type="number" inputmode="decimal" placeholder="Cash received (optional)">
    <div id="chg"></div><div id="msg"></div>
    <button id="co" disabled>Checkout and print receipt</button>
  </aside>
</div>
<button id="fab"><span id="fabN">View order</span><span id="fabT">0</span></button>
<div id="toast"></div><div id="receipt"></div>

<script>
/* ---- EDIT THESE ---- */
const API_URL="https://script.google.com/macros/s/AKfycbywQlpZgJQ_n7rIjGk_6FPfm-cgXa-bPXxVGa7xndg1PtjLzvBgCwxPT6gyYhAvUnLPlw/exec";
const STORE="Beringga and Ejera Store", TAGLINE="Fresh stocks, fair prices", CUR="₱";
const STORE_LOGO=""; // upload your store photo/logo to GitHub, then put its file name here, e.g. "logo.jpg"
/* -------------------- */
let items=[],cart={},typeSel="";const $=i=>document.getElementById(i);
const money=n=>CUR+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ok=i=>i.stock>0&&i.status!=="Temporarily unavailable";
const hue=s=>[...String(s)].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360;
$("store").textContent=STORE;$("tag").textContent=TAGLINE;document.title=STORE;
if(STORE_LOGO)$("logoBox").innerHTML=`<img class="logo" src="${esc(STORE_LOGO)}" alt="${esc(STORE)}">`;

function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),1400);}

function renderChips(){
  const ts=[...new Set(items.map(i=>i.type).filter(Boolean))];
  $("chips").innerHTML=["",...ts].map(t=>`<button class="chip ${t===typeSel?"on":""}" data-t="${esc(t)}">${t?esc(t):"All items"}</button>`).join("");
}
function renderList(){
  const q=$("q").value.trim().toLowerCase();
  const out=items.filter(i=>(!typeSel||i.type===typeSel)&&(!q||(i.id+" "+i.name).toLowerCase().includes(q))).slice(0,200);
  $("list").innerHTML=out.map(i=>{
    const s=i.status==="Temporarily unavailable"?["Unavailable","out"]:i.stock<=0?["Sold out","out"]:i.stock<=5?["Only "+i.stock+" left","low"]:[i.stock+" in stock",""];
    return `<button class="tile ${ok(i)?"":"off"}" data-id="${esc(i.id)}"><span class="sw" style="background:hsl(${hue(i.name)} 55% 38%)">${esc(String(i.name).charAt(0).toUpperCase())}</span>
    <span class="nm">${esc(i.name)}</span><span class="ty">${esc(i.type||"")}</span><span class="st ${s[1]}">${s[0]}</span><span class="tag">${money(i.price)}</span></button>`}).join("")
    ||`<div class="empty">${items.length?"No item matches your search.":"No items yet. Add products in the Inventory tab of your sheet."}</div>`;
}
function renderCart(){
  const ids=Object.keys(cart);let tot=0,n=0;
  $("lines").innerHTML=ids.map(id=>{const i=items.find(x=>x.id===id),q=cart[id];if(!i)return"";tot+=i.price*q;n+=q;
    return `<div class="ln"><div>${esc(i.name)}<br><small>${money(i.price)} each</small></div>
    <div class="qty"><button data-d="-1" data-id="${esc(id)}" aria-label="Less">−</button>${q}<button data-d="1" data-id="${esc(id)}" aria-label="More">+</button></div><b>${money(i.price*q)}</b></div>`}).join("")
    ||'<div class="none">Tap an item to add it to the order.</div>';
  $("total").textContent=money(tot);$("co").disabled=!n;
  $("fabN").textContent=n?n+(n>1?" items in order":" item in order"):"View order";$("fabT").textContent=money(tot);
  const c=Number($("pay").value)||0;$("chg").textContent=c&&tot?(c>=tot?"Change: "+money(c-tot):"Short by "+money(tot-c)):"";
  window._tot=tot;
}
$("list").onclick=e=>{const el=e.target.closest(".tile");if(!el)return;const id=el.dataset.id,i=items.find(x=>x.id===id);
  if((cart[id]||0)>=i.stock){toast("No more stock for "+i.name);return;}
  cart[id]=(cart[id]||0)+1;renderCart();toast("Added "+i.name);$("fab").classList.remove("bump");void $("fab").offsetWidth;$("fab").classList.add("bump");};
$("lines").onclick=e=>{const b=e.target.closest("button");if(!b)return;const id=b.dataset.id,i=items.find(x=>x.id===id);
  cart[id]=(cart[id]||0)+Number(b.dataset.d);if(cart[id]<=0)delete cart[id];if(cart[id]>i.stock)cart[id]=i.stock;renderCart();};
$("chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;typeSel=b.dataset.t;renderChips();renderList();};
$("q").oninput=renderList;$("pay").oninput=renderCart;
$("fab").onclick=()=>$("cart").classList.add("open");$("x").onclick=()=>$("cart").classList.remove("open");

async function load(){
  try{items=JSON.parse(localStorage.getItem("items")||"[]");}catch(e){}
  fill();
  try{items=await (await fetch(API_URL)).json();localStorage.setItem("items",JSON.stringify(items));fill();$("msg").textContent="";}
  catch(e){$("msg").textContent=items.length?"Offline. Showing the last saved prices.":"Could not load items. Check the API_URL.";}
}
function fill(){renderChips();renderList();renderCart();}

$("co").onclick=async()=>{
  $("co").disabled=true;$("msg").textContent="Saving sale...";
  try{
    const r=await (await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({cart:Object.entries(cart).map(([id,qty])=>({id,qty}))})})).json();
    if(!r.ok){$("msg").textContent=r.error;$("co").disabled=false;return;}
    const cash=Number($("pay").value)||0;
    $("receipt").innerHTML=`<div class="c"><b>${esc(STORE)}</b><br>${new Date(r.date).toLocaleString()}<br>${r.receipt}</div><hr>`
     +r.lines.map(l=>`<div>${esc(l.name)}</div><div class="l"><span>${l.qty} x ${money(l.price)}</span><span>${money(l.amount)}</span></div>`).join("")
     +`<hr><div class="l"><b>TOTAL</b><b>${money(r.total)}</b></div>`
     +(cash?`<div class="l"><span>Cash</span><span>${money(cash)}</span></div><div class="l"><span>Change</span><span>${money(cash-r.total)}</span></div>`:"")
     +`<hr><div class="c">Thank you! Come again.</div>`;
    cart={};$("pay").value="";$("msg").textContent="";$("cart").classList.remove("open");
    await load();window.print();
  }catch(e){$("msg").textContent="Sale not saved. Check your connection and try again.";$("co").disabled=false;}
};
load();
</script></body></html>
